<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Puerta — Manu Pavez</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://psnprhzowknhfylvgcci.supabase.co; frame-src https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="theme-color" content="#062C33" />
  <link rel="icon" href="logos/CUBO%20BLANCO%20MP.png" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pages/puerta.css" />
  <script src="js/supabase-config.js"></script>
  <script type="module" src="js/pages/puerta.js"></script>
</head>
<body>
  <!-- Ingreso con el código de 6 dígitos (lo elige Manu para cada persona) -->
  <main class="pt-login" data-login hidden>
    <img src="logos/CUBO%20BLANCO%20MP.png" alt="" width="40" height="40" />
    <h1>Control de puerta</h1>
    <p data-login-intro>Ingresá el código de 6 números que te pasaron.</p>
    <form data-login-form novalidate>
      <label class="pt-sr" for="pt-code">Código</label>
      <input id="pt-code" name="code" class="pt-code" type="password" inputmode="numeric" autocomplete="one-time-code"
        pattern="[0-9]{6}" maxlength="6" placeholder="······" required />
      <p class="pt-msg" data-login-msg role="alert"></p>
      <button class="pt-btn" type="submit">ENTRAR</button>
    </form>

    <!-- Manu: PIN de admin (pin-login con Turnstile y límite de intentos) -->
    <form data-admin-form novalidate hidden>
      <input class="pt-sr" type="text" name="username" autocomplete="username" value="Frequency Lab (admin)" tabindex="-1" aria-hidden="true" readonly />
      <label class="pt-sr" for="pt-admin-pin">PIN de admin</label>
      <input id="pt-admin-pin" name="password" class="pt-code" type="password" inputmode="numeric" autocomplete="current-password"
        pattern="[0-9]{6}" maxlength="6" placeholder="······" required />
      <div data-captcha></div>
      <p class="pt-msg" data-admin-msg role="alert"></p>
      <button class="pt-btn" type="submit">ENTRAR COMO MANU</button>
    </form>
    <button class="pt-link" type="button" data-admin-toggle>Soy Manu · entrar con PIN de admin</button>
  </main>

  <!-- Búsqueda: la puerta nunca descarga la lista ni muestra totales -->
  <main class="pt-app" data-app hidden>
    <header class="pt-top">
      <div class="pt-top__row">
        <p class="pt-top__event" data-event></p>
        <button class="pt-out" type="button" data-logout>Salir</button>
      </div>
      <div class="pt-search">
        <label class="pt-sr" for="pt-q">Buscar</label>
        <input id="pt-q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Nombre y apellido" data-q />
        <button type="button" class="pt-clear" data-clear aria-label="Borrar búsqueda" hidden>×</button>
      </div>
    </header>
    <p class="pt-hint" data-hint>Pedí el DNI y escribí nombre y apellido (mínimo 3 letras).</p>
    <ul class="pt-list" data-list aria-live="polite"></ul>
  </main>

  <div class="pt-toast" data-toast role="status" aria-live="assertive" hidden></div>
</body>
</html>
