<body data-page="admin">
  <main class="admin" data-admin>
    <header class="admin-head">
      <div>
        <p class="admin-kicker">Frequency Lab</p>
        <h1>Panel de alumnos</h1>
      </div>
      <div class="admin-head__actions" data-admin-actions hidden>
        <span class="admin-sync" data-sync-status>—</span>
        <button type="button" class="mp-btn ghost small" data-sync>SINCRONIZAR NOTION</button>
      </div>
    </header>

    <p class="admin-msg" data-admin-msg role="status" aria-live="polite">Verificando acceso…</p>

    <div class="admin-table-wrap" data-admin-table hidden>
      <table class="admin-table">
        <thead>
          <tr>
            <th scope="col">Alumno</th>
            <th scope="col">Email de acceso</th>
            <th scope="col">Acceso</th>
            <th scope="col">Vence</th>
            <th scope="col">Última sesión</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr>
        </thead>
        <tbody data-admin-rows></tbody>
      </table>
    </div>

    <p class="admin-foot"><a href="clinicas.html#alumnos">← Volver al área de alumnos</a></p>
  </main>
