<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tu espacio — Frequency Lab</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://esm.sh https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self' https://esm.sh https://psnprhzowknhfylvgcci.supabase.co wss://psnprhzowknhfylvgcci.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="theme-color" content="#050711" />
  <link rel="icon" href="logos/CUBO%20BLANCO%20MP.png" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/alumnos.css" />
  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/pages/alumnos.js"></script>
</head>
<body data-page="alumnos">
  <header class="lab-top">
    <a class="lab-top__brand" href="alumnos.html">
      <img src="logos/CUBO%20BLANCO%20MP.png" alt="" width="26" height="26" />
      <span>Frequency Lab</span>
    </a>
    <nav class="lab-top__nav" aria-label="Espacio del alumno">
      <a class="lab-top__link" href="shop.html">SHOP</a>
      <button type="button" class="mp-btn ghost small" data-logout hidden>CERRAR SESIÓN</button>
    </nav>
  </header>

  <main class="lab-main">
    <p class="lab-status" data-status role="status" aria-live="polite">Cargando…</p>

    <section class="lab-login" data-login hidden aria-labelledby="login-title">
      <p class="lab-login__kicker">Frequency Lab</p>
      <h1 id="login-title" class="lab-login__title">Tu espacio</h1>
      <form class="lab-login__form" data-pin-form novalidate>
        <label for="pin">Ingresá tu código de acceso</label>
        <input id="pin" class="lab-pin" type="text" inputmode="numeric" autocomplete="one-time-code"
          pattern="[0-9]{6}" maxlength="6" placeholder="······" required />
        <div class="lab-login__captcha" data-captcha></div>
        <p class="lab-login__note" data-note role="status" aria-live="polite"></p>
        <button type="submit" class="mp-btn primary" data-submit>ENTRAR</button>
      </form>
      <p class="lab-login__alt"><a href="clinicas.html#alumnos" data-email-link>¿No tenés tu código? Entrá con tu email</a></p>
    </section>

    <div class="lab-portal" data-portal hidden></div>
  </main>
</body>
</html>
