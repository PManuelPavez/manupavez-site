
[functions.send-lead-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-lead-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-lead-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-lead-email/*.html" ]

[functions.notion-sync]
enabled = true
# Autenticación propia: secreto del cron (Vault) o JWT de un admin (ver index.ts)
verify_jwt = false
entrypoint = "./functions/notion-sync/index.ts"

[functions.pin-login]
enabled = true
# Público a propósito: el límite de intentos y la validación viven en la base (pin_login_attempt)
verify_jwt = false
entrypoint = "./functions/pin-login/index.ts"

[functions.lab-notify]
enabled = true
# Solo la llama pg_cron con el secreto de Vault (ver index.ts)
verify_jwt = false
entrypoint = "./functions/lab-notify/index.ts"

[functions.mp-checkout]
enabled = true
# Público (shop con Turnstile) + link de admin (JWT verificado adentro)
verify_jwt = false
entrypoint = "./functions/mp-checkout/index.ts"

[functions.mp-webhook]
enabled = true
# Lo llama MercadoPago: se valida la firma x-signature y se re-consulta el pago
verify_jwt = false
entrypoint = "./functions/mp-webhook/index.ts"

[functions.notion-file]
enabled = true
# JWT verificado adentro (alumno con acceso vigente o admin) + dueño del archivo
verify_jwt = false
entrypoint = "./functions/notion-file/index.ts"
